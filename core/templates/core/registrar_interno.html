{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Nuevo Interno</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-6">

    <div class="max-w-3xl mx-auto bg-white rounded-lg shadow-md p-8">
        <div class="flex justify-between items-center mb-6 pb-4 border-b">
            <h1 class="text-2xl font-bold text-teal-800">Registrar Nuevo Interno</h1>
            <a href="{% url 'expedientes_generales' %}" class="bg-gray-500 hover:bg-gray-600 text-white px-4 py-2 rounded text-sm transition">
                ← Volver al Listado
            </a>
        </div>

        <form method="POST" class="space-y-4">
            {% csrf_token %}
            
            <div class="grid grid-cols-1 gap-4">
                {{ form.as_p }}
            </div>

            <div class="pt-6 flex justify-end gap-3 border-t">
                <a href="{% url 'expedientes_generales' %}" class="bg-gray-300 text-gray-700 px-5 py-2 rounded hover:bg-gray-400 transition">
                    Cancelar
                </a>
                <button type="submit" class="bg-emerald-600 hover:bg-emerald-700 text-white px-6 py-2 rounded font-semibold transition">
                    Guardar Expediente
                </button>
            </div>
        </form>
    </div>

</body>
</html>
