<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"><title>Gastos Operativos Asilo</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-gray-100 min-h-screen">
    <nav class="bg-amber-700 text-white shadow-md px-6 py-3 flex justify-between items-center">
        <a href="{% url 'dashboard' %}" class="hover:bg-amber-800 p-2 rounded text-sm font-semibold">← Volver al Menú</a>
        <span class="text-xl font-bold">Módulo 4: Gastos Operativos del Asilo</span>
    </nav>
    <div class="max-w-7xl mx-auto py-10 px-6">
        <h2 class="text-2xl font-bold text-gray-800 mb-4">Egresos y Costos Operativos</h2>
        <div class="bg-white rounded-xl shadow overflow-hidden border">
            <table class="w-full text-left text-sm">
                <thead class="bg-gray-50 text-gray-700 uppercase text-xs border-b">
                    <tr><th class="px-6 py-3">Fecha</th><th class="px-6 py-3">Concepto</th><th class="px-6 py-3">Categoría</th><th class="px-6 py-3">Monto (Q)</th></tr>
                </thead>
                <tbody class="divide-y text-gray-600">
                    {% for g in gastos %}
                    <tr class="hover:bg-gray-50"><td class="px-6 py-4">{{ g.fecha }}</td><td class="px-6 py-4 font-bold text-gray-800">{{ g.concepto }}</td><td class="px-6 py-4 text-amber-700 font-semibold">{{ g.categoria }}</td><td class="px-6 py-4 font-semibold text-rose-700">Q{{ g.monto }}</td></tr>
                    {% empty %}
                    <tr><td colspan="4" class="px-6 py-10 text-center text-gray-400 italic">No hay gastos operativos registrados.</td></tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
