<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"><title>Reportes Clínicos Paciente</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-gray-100 min-h-screen">
    <nav class="bg-rose-700 text-white shadow-md px-6 py-3 flex justify-between items-center">
        <a href="{% url 'dashboard' %}" class="hover:bg-rose-800 p-2 rounded text-sm font-semibold">← Volver al Menú</a>
        <span class="text-xl font-bold">Módulo 5: Compilación de Historiales Clínicos</span>
    </nav>
    <div class="max-w-7xl mx-auto py-10 px-6">
        <h2 class="text-2xl font-bold text-gray-800 mb-4">Reportes Consolidados por Residente</h2>
        <div class="bg-white rounded-xl shadow overflow-hidden border">
            <table class="w-full text-left text-sm">
                <thead class="bg-gray-50 text-gray-700 uppercase text-xs border-b">
                    <tr><th class="px-6 py-3">Residente</th><th class="px-6 py-3">Motivo de Reclusión</th><th class="px-6 py-3 text-center">Acción</th></tr>
                </thead>
                <tbody class="divide-y text-gray-600">
                    <tr class="hover:bg-gray-50"><td class="px-6 py-4 font-bold text-gray-800">{{ i.nombre }} {{ i.apellido }}</td><td class="px-6 py-4">{{ i.motivo_reclusion }}</td><td class="px-6 py-4 text-center"><a href="#" class="text-rose-600 hover:underline font-semibold">Generar Reporte Clínico</a></td></tr>
                    <tr><td colspan="3" class="px-6 py-10 text-center text-gray-400 italic">No hay residentes registrados.</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
