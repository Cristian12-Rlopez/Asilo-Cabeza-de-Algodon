<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"><title>Control Costos por Cita</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-gray-100 min-h-screen">
    <nav class="bg-rose-700 text-white shadow-md px-6 py-3 flex justify-between items-center">
        <a href="{% url 'dashboard' %}" class="hover:bg-rose-800 p-2 rounded text-sm font-semibold">← Volver al Menú</a>
        <span class="text-xl font-bold">Módulo 5: Control de Costos por Cita Médica</span>
    </nav>
    <div class="max-w-7xl mx-auto py-10 px-6">
        <h2 class="text-2xl font-bold text-gray-800 mb-4">Seguimiento de Gastos por Servicios Externos</h2>
        <div class="bg-white rounded-xl shadow overflow-hidden border">
            <table class="w-full text-left text-sm">
                <thead class="bg-gray-50 text-gray-700 uppercase text-xs border-b">
                    <tr><th class="px-6 py-3">Fecha Cita</th><th class="px-6 py-3">Especialista</th><th class="px-6 py-3 text-center">Estado Financiero</th></tr>
                </thead>
                <tbody class="divide-y text-gray-600">
                    {% for c in citas %}
                    <tr class="hover:bg-gray-50"><td class="px-6 py-4 font-bold text-gray-800">{{ c.fecha_hora_cita }}</td><td class="px-6 py-4">{{ c.medico_especialista }}</td><td class="px-6 py-4 text-center"><span class="bg-emerald-100 text-emerald-800 text-xs px-2.5 py-1 rounded-full font-semibold">Costo Liquidado</span></td></tr>
                    {% empty %}
                    <tr><td colspan="3" class="px-6 py-10 text-center text-gray-400 italic">No hay costos de citas registrados.</td></tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
