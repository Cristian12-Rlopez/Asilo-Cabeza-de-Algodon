<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"><title>Carga Resultados Digitales</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-gray-100 min-h-screen">
    <nav class="bg-purple-700 text-white shadow-md px-6 py-3 flex justify-between items-center">
        <a href="{% url 'dashboard' %}" class="hover:bg-purple-800 p-2 rounded text-sm font-semibold">← Volver al Menú</a>
        <span class="text-xl font-bold">Laboratorio Digital e Informes (RF-09)</span>
    </nav>
    <div class="max-w-7xl mx-auto py-10 px-6">
        <h2 class="text-2xl font-bold text-gray-800 mb-4">Resultados Cargados</h2>
        <div class="bg-white rounded-xl shadow overflow-hidden border">
            <table class="w-full text-left text-sm">
                <thead class="bg-gray-50 text-gray-700 uppercase text-xs border-b">
                    <tr><th class="px-6 py-3">Residente</th><th class="px-6 py-3">Examen</th><th class="px-6 py-3">Informe de Resultado</th></tr>
                </thead>
                <tbody class="divide-y text-gray-600">
                    {% for o in ordenes %}
                    <tr class="hover:bg-gray-50"><td class="px-6 py-4 font-bold text-gray-800">{{ o.consulta.interno }}</td><td class="px-6 py-4">{{ o.tipo_examen }}</td><td class="px-6 py-4 text-emerald-700 font-semibold">{{ o.resultado|default:"Resultado en proceso" }}</td></tr>
                    {% empty %}
                    <tr><td colspan="3" class="px-6 py-10 text-center text-gray-400 italic">No hay resultados adjuntos.</td></tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
